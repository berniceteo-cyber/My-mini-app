<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CG Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --green: #2E7D4F; --green-dark: #1F5C39; --green-soft: #EEF5EF;
    --blue: #2563A8; --blue-soft: #EAF1F9; --gold-soft: #FFF4D6; --gold: #F2C76B;
    --ink: #1E2A22; --muted: #56635A; --line: #E2E6DE; --bg: #F6F7F2; --card: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line);
           height: 60px; display: flex; align-items: center; gap: 8px; padding: 0 12px; }
  header h1 { margin: 0; font-size: 20px; flex: 1; }
  .back { width: 44px; height: 44px; border: none; background: none; font-size: 28px; cursor: pointer; color: var(--ink); }
  .me-btn { border: none; background: none; padding: 0; cursor: pointer; }
  main { padding: 16px 16px 150px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .label { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0; }
  .big { font-size: 18px; font-weight: 800; margin: 0; }
  .sub { font-size: 15px; color: var(--muted); margin: 0; }
  .btn { min-height: 50px; border-radius: 12px; border: none; background: var(--green); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; padding: 0 12px; }
  .btn.outline { background: #fff; color: var(--green); border: 2px solid var(--green); }
  .btn.blue { background: var(--blue); }
  .btn.grey { background: #fff; color: var(--muted); border: 2px solid var(--muted); }
  .btn.dashed { background: none; color: var(--muted); border: 2px dashed #B9C3B6; }
  .row { display: flex; gap: 10px; }
  .stat { flex: 1; border-radius: 12px; padding: 12px; font-size: 13px; }
  .stat b { display: block; font-size: 24px; }
  .item { text-align: left; width: 100%; font: inherit; color: inherit; cursor: pointer; display: flex; gap: 14px; align-items: center; }
  .tile { width: 52px; height: 56px; flex-shrink: 0; border-radius: 12px; background: var(--green-soft); color: var(--green-dark);
          display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; line-height: 1.1; }
  .tile small { font-size: 12px; } .tile span { font-size: 20px; }
  .badge { width: 52px; height: 52px; flex-shrink: 0; border-radius: 12px; background: var(--green-soft); display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .av { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; flex-shrink: 0; border: 2px solid #fff; }
  .stack { display: flex; } .stack .av + .av { margin-left: -10px; }
  .verse { background: #E9EFE6; border-radius: 16px; padding: 16px; font-style: italic; line-height: 1.45; }
  .verse b { font-style: normal; display: block; margin-top: 4px; }
  .hero { background: var(--green); color: #fff; border-radius: 20px; padding: 18px; display: flex; gap: 14px; align-items: center; }
  .hero p { margin: 0; } .hero .hi { font-size: 24px; font-weight: 800; } .hero .chip { background: rgba(255,255,255,.18); }
  .chip { display: inline-block; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--green-soft); color: var(--green-dark); }
  .garden { display: flex; gap: 6px; overflow-x: auto; padding: 8px 4px 0; background: linear-gradient(to top, #C9A882 0 18px, transparent 18px); border-radius: 12px; }
  .gplant { border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-width: 72px; min-height: 100px; cursor: pointer; font: inherit; }
  .gplant small { font-size: 11px; font-weight: 700; color: #fff; background: rgba(0,0,0,.35); padding: 1px 6px; border-radius: 6px; margin-bottom: 2px; }
  .pot { position: relative; height: 170px; width: 100%; display: flex; align-items: flex-end; justify-content: center;
         background: linear-gradient(to top, #C9A882 0 22px, transparent 22px); border-radius: 12px; overflow: hidden; }
  .plant { display: inline-block; line-height: 1; margin-bottom: 14px; transform-origin: bottom center; }
  .grow { animation: grow .7s ease; }
  @keyframes grow { 0% { transform: scale(1); } 40% { transform: scale(1.3) rotate(-6deg); } 70% { transform: scale(.95) rotate(3deg); } 100% { transform: scale(1); } }
  .drop { position: absolute; left: 50%; top: 0; font-size: 34px; animation: drop .6s ease-in forwards; }
  @keyframes drop { from { transform: translate(-50%, -30px); opacity: 1; } to { transform: translate(-50%, 90px); opacity: 0; } }
  .fruit { position: absolute; font-size: 30px; animation: pop .6s ease; }
  .levelup { background: var(--gold-soft); color: #7A4B00; border-radius: 14px; padding: 12px; text-align: center; font-weight: 800; font-size: 16px; animation: pop .6s ease; }
  @keyframes pop { 0% { transform: scale(.5); opacity: 0; } 60% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
  .journey { display: flex; justify-content: space-between; width: 100%; font-size: 26px; }
  .journey span { opacity: .25; } .journey span.done { opacity: 1; }
  .milestone { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 8px 12px; border: 1px solid var(--line);
               border-radius: 12px; background: #fff; font: inherit; font-size: 15px; font-weight: 700; color: var(--ink); text-align: left; cursor: pointer; }
  .milestone.on { background: var(--gold-soft); border-color: var(--gold); }
  .badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .bdg { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: 8px 4px; border-radius: 12px; background: #F1F2EE; opacity: .45; }
  .bdg span { font-size: 26px; } .bdg b { font-size: 11px; } .bdg small { font-size: 10px; color: var(--muted); }
  .bdg.on { opacity: 1; background: var(--gold-soft); }
  .msg { display: flex; gap: 10px; align-items: flex-start; }
  .bubble { background: var(--blue-soft); border-radius: 4px 14px 14px 14px; padding: 10px 12px; flex: 1; font-size: 15px; line-height: 1.4; }
  .bubble small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 2px; font-weight: 700; }
  label { font-weight: 700; font-size: 15px; }
  input, textarea, select { min-height: 48px; border-radius: 12px; border: 1px solid #B9C3B6; padding: 10px 14px; font-size: 16px; width: 100%; font-family: inherit; background: #fff; color: var(--ink); }
  textarea { min-height: 80px; resize: vertical; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .pick { display: flex; flex-wrap: wrap; gap: 8px; }
  .pick button { min-width: 48px; min-height: 48px; border-radius: 12px; border: 2px solid var(--line); background: #fff; font-size: 24px; cursor: pointer; }
  .pick button.on { border-color: var(--green); background: var(--green-soft); }
  .pick.colors button { border-radius: 50%; }
  .pick.colors button.on { border-color: var(--ink); }
  .pick.people button { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; color: var(--ink); }
  .center { text-align: center; align-items: center; padding: 40px 16px; }
  .busy { opacity: .6; pointer-events: none; }
  .toast { position: fixed; left: 12px; right: 12px; bottom: 84px; z-index: 6; background: #1E2A22; color: #fff; border-radius: 14px;
           padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px; font-size: 15px; animation: pop .3s ease; }
  .toast span { flex: 1; }
  .toast button { min-height: 44px; padding: 0 16px; border: none; border-radius: 10px; background: var(--gold); color: #1E2A22; font-size: 15px; font-weight: 800; cursor: pointer; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; height: 72px; background: var(--card); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); }
  nav button { border: none; background: none; font-size: 12px; font-weight: 700; color: #5F6B63; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  nav button span { font-size: 22px; }
  nav button.active { color: var(--green); }
  .overlay { position: fixed; inset: 0; z-index: 20; background: rgba(20,30,24,.55); display: flex; align-items: center; justify-content: center; padding: 24px; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .overlay .box { background: #fff; border-radius: 24px; padding: 28px 22px; width: 100%; max-width: 360px; text-align: center; display: flex; flex-direction: column; gap: 10px; animation: pop .5s ease; }
  .overlay .bigemoji { font-size: 84px; line-height: 1; animation: bounce 1.2s ease infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .overlay .title { font-size: 22px; font-weight: 800; margin: 0; }
  .overlay .vs { font-style: italic; color: var(--muted); font-size: 14px; margin: 0; }
  .confetti { position: fixed; top: -40px; z-index: 30; pointer-events: none; font-size: 22px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .9; } }
  .splash { position: fixed; z-index: 30; pointer-events: none; font-size: 22px; animation: splash .8s ease-out forwards; }
  @keyframes splash { from { transform: translate(0,0) scale(1); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(.4); opacity: 0; } }
  .ring { width: 92px; height: 92px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .ring > div { width: 72px; height: 72px; border-radius: 50%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
  .ring b { font-size: 20px; } .ring small { font-size: 11px; color: var(--muted); }
  .bars { display: flex; gap: 6px; align-items: flex-end; height: 54px; flex: 1; }
  .bars div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; justify-content: flex-end; height: 100%; }
  .bars span { width: 100%; border-radius: 5px 5px 2px 2px; background: var(--blue); min-height: 4px; }
  .bars span.today { background: var(--green); }
  .bars small { font-size: 10px; color: var(--muted); font-weight: 700; }
  .feed { display: flex; flex-direction: column; gap: 10px; }
  .feed .f { display: flex; gap: 10px; align-items: center; font-size: 14px; }
  .feed .f p { margin: 0; flex: 1; line-height: 1.35; } .feed .f small { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .today-card { background: var(--blue-soft); border-color: #C9DCF1; }
  .prog { height: 5px; width: 100%; border-radius: 3px; background: #E2E6DE; overflow: hidden; margin-top: 3px; }
  .prog i { display: block; height: 100%; background: var(--gold); }
  .waterbtn:active { transform: scale(.97); }
  .av { overflow: hidden; } .av svg { display: block; }
  /* ---- avatar builder ---- */
  .opts { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .opts button { border: 3px solid transparent; background: none; border-radius: 50%; padding: 0; cursor: pointer; flex-shrink: 0; }
  .opts button.on { border-color: var(--green); }
  .seg { display: flex; background: #EDEFE9; border-radius: 12px; padding: 4px; gap: 4px; }
  .seg button { flex: 1; min-height: 44px; border: none; border-radius: 9px; background: none; font: inherit; font-weight: 800; color: var(--muted); cursor: pointer; }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  /* ---- garden world ---- */
  .world-wrap { overflow-x: auto; border-radius: 22px; -webkit-overflow-scrolling: touch; box-shadow: 0 6px 20px rgba(30,42,34,.18); }
  .world { position: relative; height: 460px; overflow: hidden; min-width: 100%; }
  .world.morning { background: linear-gradient(#FFD3A1, #BFE3F5 65%); }
  .world.day     { background: linear-gradient(#6FC3EE, #D9F2FB 65%); }
  .world.sunset  { background: linear-gradient(#5B4B8A, #F28F6B 50%, #F9D29D 75%); }
  .world.night   { background: linear-gradient(#10173A, #2E3F72 75%); }
  .w-label { position: absolute; top: 14px; left: 14px; z-index: 3; background: rgba(255,255,255,.88); border-radius: 12px; padding: 6px 12px; font-weight: 800; font-size: 13px; color: var(--ink); }
  .w-sun { position: absolute; top: 22px; right: 26px; font-size: 54px; line-height: 1; filter: drop-shadow(0 0 18px rgba(255,214,110,.95)); animation: glow 4s ease-in-out infinite; }
  @keyframes glow { 50% { transform: scale(1.08); } }
  .cloud { position: absolute; left: 0; font-size: 48px; opacity: .92; animation: drift linear infinite; }
  @keyframes drift { from { transform: translateX(-140px); } to { transform: translateX(var(--w)); } }
  .star { position: absolute; width: 3px; height: 3px; background: #fff; border-radius: 50%; animation: twinkle 1.8s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: .2; } to { opacity: 1; } }
  .rainbow { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); width: 560px; max-width: 95%; opacity: .7; }
  .hills { position: absolute; left: 0; bottom: 0; width: 100%; height: 240px; }
  .flower { position: absolute; font-size: 14px; line-height: 1; }
  .wplant { position: absolute; bottom: 92px; transform: translateX(-50%); border: none; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; font: inherit; padding: 0; z-index: 2; }
  .wplant .sway { display: inline-block; transform-origin: bottom center; animation: sway 3.2s ease-in-out infinite; line-height: 1; position: relative; }
  @keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  .wplant .wf { position: absolute; font-size: 18px; }
  .wplant .tag { font-size: 11px; font-weight: 800; color: var(--ink); background: rgba(255,255,255,.9); padding: 2px 8px; border-radius: 8px; margin-top: 3px; white-space: nowrap; }
  .wplant .drops { position: absolute; top: -22px; font-size: 12px; font-weight: 800; background: #fff; color: var(--blue); border-radius: 10px; padding: 1px 7px; white-space: nowrap; animation: bounce 1.6s ease infinite; }
  .walker { position: absolute; bottom: 10px; transform: translateX(-50%); z-index: 3; display: flex; flex-direction: column; align-items: center; }
  .walker.stroll { animation: stroll 10s ease-in-out infinite alternate; }
  @keyframes stroll { from { transform: translateX(-50%); } to { transform: translateX(calc(-50% + 46px)); } }
  .walker .bob { animation: bob 1.3s ease-in-out infinite; position: relative; }
  @keyframes bob { 50% { transform: translateY(-5px); } }
  .walker small { font-size: 11px; font-weight: 800; color: #fff; background: rgba(0,0,0,.4); border-radius: 8px; padding: 1px 7px; margin-top: 2px; white-space: nowrap; }
  .walker .pray { position: absolute; top: -14px; right: -6px; font-size: 16px; animation: bounce 1.6s ease infinite; }
  .butterfly { position: absolute; z-index: 2; font-size: 22px; animation: flutter 8s ease-in-out infinite alternate; }
  @keyframes flutter { 0% { transform: translate(0,0) rotate(-8deg); } 25% { transform: translate(50px,-30px) rotate(8deg); } 50% { transform: translate(100px,10px) rotate(-6deg); }
                       75% { transform: translate(60px,-40px) rotate(6deg); } 100% { transform: translate(150px,-6px) rotate(-4deg); } }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .ph { display: block; border: none; padding: 0; border-radius: 10px; overflow: hidden; aspect-ratio: 1; background: #E9ECE6; cursor: pointer; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .viewer img { max-width: 100%; max-height: 60vh; border-radius: 14px; display: block; margin: 0 auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  body.busy main { opacity: .6; pointer-events: none; }
</style></head>
<body>
<header>
  <button class="back" id="back" aria-label="Back" hidden>‹</button>
  <h1 id="title">CG Hub</h1>
  <button class="me-btn" id="me-btn" aria-label="My profile"></button>
</header>
<main id="app"><p class="sub" style="text-align:center;margin-top:40px">Loading our garden… 🌱</p></main>
<nav id="nav">
  <button data-tab="home"><span>🏠</span>Home</button>
  <button data-tab="world"><span>🌍</span>World</button>
  <button data-tab="seeds"><span>🌱</span>Seeds</button>
  <button data-tab="events"><span>📅</span>Events</button>
  <button data-tab="cg"><span>👥</span>Our CG</button>
</nav>

<script>
// ================= SETTINGS YOU CAN CHANGE =================
const API_URL  = "https://ylojbxsdvoesdhwbjtfo.supabase.co/functions/v1/api";  // your Supabase security guard
const BOT_LINK = "https://t.me/BEGROWINGbot";                                // link people get when you invite them
// ---- Bible verses shown in the app ----
// These use the WEB (World English Bible), which is free to use.
// To switch to the NIV: replace each text below with the NIV wording, change BIBLE_VERSION to "NIV",
// and paste the credit line from Biblica's permissions page into BIBLE_CREDIT.
const BIBLE_VERSION = "WEB";
const BIBLE_CREDIT  = "";
const VERSE = {
  garden: { ref: "1 Corinthians 3:6", text: "I planted. Apollos watered. But God gave the increase." },                                  // Seeds tab
  party:  { ref: "Luke 15:10",        text: "Even so, I tell you, there is joy in the presence of the angels of God over one sinner repenting." }  // when someone is saved
};
const VERSES = [   // one of these appears at random in celebrations
  { ref: "1 Thessalonians 5:17", text: "Pray without ceasing." },
  { ref: "James 5:16",           text: "The insistent prayer of a righteous person is powerfully effective." },
  { ref: "Galatians 6:9",        text: "Let’s not be weary in doing good, for we will reap in due season if we don’t give up." },
  VERSE.garden
];
const AVATARS = ["🦁","🐻","🐼","🦊","🐨","🐯","🐸","🐧","🦉","🐳","🦋","🌻"];
const COLORS  = ["#F2C76B","#9AD0A8","#9CC3EA","#F4A99B","#C9B6E8","#F7C59F"];

const MILESTONES = [
  { key: "metcg",   icon: "🤝", label: "Met the CG" },
  { key: "church",  icon: "⛪", label: "Stepped into church" },
  { key: "saved",   icon: "✝️", label: "Salvation" },
  { key: "planted", icon: "🏡", label: "Planted in church" },
  { key: "fp",      icon: "📖", label: "Started FP" }
];
const STAGES = ["Seedling", "Growing", "Taking root", "Strong tree", "Deeply rooted"];
const KINDS = [
  { pace: 1,        fruit: "🍓", name: "strawberry plant", looks: ["🌱","🌿","☘️","🌼","🌼","🌼"] },
  { pace: 3,        fruit: "🍊", name: "orange tree",      looks: ["🌱","🌿","🪴","🌳","🌳","🌳"] },
  { pace: Infinity, fruit: "🥥", name: "coconut palm",     looks: ["🌱","🌿","🪴","🌴","🌴","🌴"] }
];
// Each badge: what you need (goal) and how far you are (have)
const BADGES = [
  { icon: "💧", name: "First Drop",      how: "Pray once",          goal: 1,   have: (p) => p.count },
  { icon: "🌦️", name: "Spring Shower",   how: "Pray 10 times",      goal: 10,  have: (p) => p.count },
  { icon: "🌧️", name: "Rain of Prayer",  how: "Pray 25 times",      goal: 25,  have: (p) => p.count },
  { icon: "🌊", name: "River of Prayer", how: "Pray 50 times",      goal: 50,  have: (p) => p.count },
  { icon: "🏆", name: "Prayer Warrior",  how: "Pray 100 times",     goal: 100, have: (p) => p.count },
  { icon: "🔥", name: "On Fire",         how: "3 days in a row",    goal: 3,   have: () => streak() },
  { icon: "⭐", name: "Faithful Week",   how: "7 days in a row",    goal: 7,   have: () => streak() },
  { icon: "🤲", name: "Big Heart",       how: "Pray for 3 friends", goal: 3,   have: (p) => p.seeds.length }
];
BADGES.forEach((b) => { b.got = (p) => b.have(p) >= b.goal; });

// Encouragement after praying
const CHEERS = ["Every drop counts 💧", "Your prayer matters 🙏", "Keep sowing! 🌱", "God hears you 💛", "Faithful in the small things ✨", "The garden is growing 🌿"];
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

// ================= HELPERS =================
const DAY = 86400000;
const localDay = (d) => new Date(d).toLocaleDateString("en-CA");          // YYYY-MM-DD in your time zone
const todayKey = () => localDay(Date.now());
const dayFromNow = (n) => localDay(Date.now() + n * DAY);
const esc = (t) => String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const an = (w) => (/^[aeiou]/i.test(w) ? "an " : "a ") + w;
const andList = (xs) => xs.length < 2 ? xs.join("") : xs.slice(0, -1).join(", ") + " & " + xs[xs.length - 1];
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
const monthsBetween = (a, b) => (new Date(b) - new Date(a)) / (30.44 * DAY);
const monthText = (n) => n < 1 ? "under a month" : plural(n, "month");
const shortDate = (iso) => new Date(iso).toLocaleDateString("en-SG", { day: "numeric", month: "short", year: "numeric" });
const fmtDate = (d) => new Date(d + "T00:00").toLocaleDateString("en-SG", { weekday: "short", day: "numeric", month: "short" });
const fmtTime = (t) => { if (!t) return ""; const [h, m] = t.split(":").map(Number); return ((h % 12) || 12) + ":" + String(m).padStart(2, "0") + (h < 12 ? " AM" : " PM"); };
// ---- Character avatars ----
// A character is saved as "~" plus 6 digits: skin, hair, hair colour, eyes, mouth, extra
const SKINS    = ["#FFDBC4", "#F6C9A0", "#E0AC69", "#C68642", "#8D5524", "#5C3A21"];
const HAIRCOLS = ["#2B1B12", "#6B3E1E", "#C98B3B", "#E8C770", "#B5513A", "#7C5CBF"];
const AV_PARTS = [
  { key: "skin",    label: "Skin",        n: 6 },
  { key: "hair",    label: "Hair",        n: 6 },
  { key: "hairCol", label: "Hair colour", n: 6 },
  { key: "eyes",    label: "Eyes",        n: 4 },
  { key: "mouth",   label: "Smile",       n: 4 },
  { key: "extra",   label: "Extra",       n: 6 }
];
function parseAv(a) {
  if (!a || a[0] !== "~") return null;
  const d = a.slice(1).split("").map(Number), c = {};
  AV_PARTS.forEach((p, i) => { c[p.key] = Math.min(p.n - 1, d[i] || 0); });
  return c;
}
const encAv = (c) => "~" + AV_PARTS.map((p) => c[p.key]).join("");
const randomAv = () => { const c = {}; AV_PARTS.forEach((p) => { c[p.key] = Math.floor(Math.random() * p.n); }); return encAv(c); };

}

  const fringe = `<path d="M25 46 Q25 17 50 17 Q75 17 75 46 Q70 30 52 29 Q38 29 25 46Z" fill="${hc}"/>`;
  const back = c.hair === 1 ? `<path d="M24 48 Q20 14 50 14 Q80 14 76 48 L80 82 Q66 78 64 62 L36 62 Q34 78 20 82Z" fill="${hc}"/>` : "";
  const front = [
    fringe, fringe,
    [[30,32],[38,22],[50,18],[62,22],[70,32],[26,42],[74,42]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="9" fill="${hc}"/>`).join(""),
    fringe + `<circle cx="50" cy="12" r="9" fill="${hc}"/>`,
    `<path d="M25 44 L28 24 L35 31 L39 15 L46 27 L52 11 L57 26 L64 15 L67 30 L73 23 L75 44 Q65 32 50 32 Q35 32 25 44Z" fill="${hc}"/>`,
    ""
  ][c.hair];
  const line = (d, w) => `<path d="${d}" stroke="${ink}" stroke-width="${w || 2.6}" fill="none" stroke-linecap="round"/>`;
  const eyes = [
    `<circle cx="41" cy="46" r="3.3" fill="${ink}"/><circle cx="59" cy="46" r="3.3" fill="${ink}"/><circle cx="42" cy="45" r="1" fill="#fff"/><circle cx="60" cy="45" r="1" fill="#fff"/>`,
    line("M37 47 Q41 42 45 47 M55 47 Q59 42 63 47"),
    `<circle cx="41" cy="46" r="3.3" fill="${ink}"/>` + line("M55 47 Q59 43 63 47"),
    `<circle cx="41" cy="46" r="7" fill="rgba(255,255,255,.4)" stroke="${ink}" stroke-width="2.2"/><circle cx="59" cy="46" r="7" fill="rgba(255,255,255,.4)" stroke="${ink}" stroke-width="2.2"/>` +
      line("M48 46 L52 46", 2.2) + `<circle cx="41" cy="46" r="2.4" fill="${ink}"/><circle cx="59" cy="46" r="2.4" fill="${ink}"/>`
  ][c.eyes];
  const mouth = [
    line("M43 56 Q50 62 57 56"),
    `<path d="M41 55 Q50 67 59 55 Z" fill="${ink}"/><path d="M44 56 L56 56 L55 58.5 L45 58.5Z" fill="#fff"/>`,
    `<ellipse cx="50" cy="58" rx="4" ry="4.6" fill="${ink}"/><ellipse cx="50" cy="60" rx="2.4" ry="1.6" fill="#F4A99B"/>`,
    line("M43 56 Q46.5 60 50 56 Q53.5 60 57 56", 2.4)
  ][c.mouth];
  const extra = [
    "",
    `<path d="M25 38 Q26 15 50 15 Q74 15 75 38Z" fill="${shirt}"/><path d="M52 35 Q80 33 88 40 Q72 42 52 40Z" fill="${dark}"/><circle cx="50" cy="15" r="3" fill="${dark}"/>`,
    [[29,31,"#F4A99B"],[38,22,"#F2C76B"],[50,18,"#C9B6E8"],[62,22,"#F4A99B"],[71,31,"#F2C76B"]].map(([x, y, f]) => `<circle cx="${x}" cy="${y}" r="5.5" fill="${f}"/><circle cx="${x}" cy="${y}" r="2" fill="#fff"/>`).join(""),
    `<path d="M23 46 Q23 12 50 12 Q77 12 77 46" stroke="${ink}" stroke-width="4" fill="none"/><rect x="17" y="39" width="11" height="17" rx="5" fill="${shirt}"/><rect x="72" y="39" width="11" height="17" rx="5" fill="${shirt}"/>`,
    `<path d="M24 38 Q24 11 50 11 Q76 11 76 38Z" fill="${shirt}"/><rect x="22" y="33" width="56" height="10" rx="5" fill="${dark}"/><circle cx="50" cy="9" r="6" fill="${dark}"/>`,
    `<path d="M60 22 L71 15 L71 31Z M60 22 L49 15 L49 31Z" fill="#F4A99B"/><circle cx="60" cy="23" r="3.5" fill="#E07A6A"/>`
  ][c.extra];
  return `<svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true">${back}
    <path d="M14 100 Q17 73 50 71 Q83 73 86 100Z" fill="${shirt}"/><rect x="44" y="62" width="12" height="12" rx="4" fill="${skin}"/>
    <circle cx="26" cy="48" r="5" fill="${skin}"/><circle cx="74" cy="48" r="5" fill="${skin}"/><circle cx="50" cy="45" r="24" fill="${skin}"/>
    <circle cx="35" cy="54" r="4" fill="#F4A99B" opacity=".55"/><circle cx="65" cy="54" r="4" fill="#F4A99B" opacity=".55"/>

const avatar = (p, size) => { size = size || 40;
  const c = parseAv(p.avatar);
  if (c) return `<span class="av" style="width:${size}px;height:${size}px;background:${esc(shade(p.color || "#F2C76B", 0.45))}">${charSvg(c, p.color || "#F2C76B")}</span>`;
  return `<span class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.55)}px;background:${esc(p.color)}">${esc(p.avatar)}</span>`; };

const tg = window.Telegram && Telegram.WebApp;
async function api(action, params) {
  const res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ initData: (tg && tg.initData) || "", action: action }, params || {})) });
  const out = await res.json().catch(() => ({ error: "Couldn’t reach the server. Check your internet." }));
  if (!res.ok || out.error) throw new Error(out.error || "Something went wrong.");
  return out;
}

// The shared data, turned into a shape the screens can use
let status = "loading", meRow = null, members = [], pending = [], seeds = [], events = [], myPrayers = { count: 0, days: [], seeds: [] };
let allPrayers = [], allNotes = [], rawEvents = [], allEventPrayers = [], photos = [];
async function refresh() {
  const d = await api("load");
  status = d.status; meRow = d.me;
  if (status !== "approved") return;
  const myId = d.me.telegram_id;
  const toPerson = (m) => ({ id: String(m.telegram_id), name: m.name, avatar: m.avatar, color: m.color, role: m.role, leader: m.is_leader });
  members = d.members.map(toPerson);
  pending = d.pending.map(toPerson);
  seeds = d.seeds.map((s) => ({
    id: s.id, nick: s.nick, outing: s.outing || "No outing logged yet", by: String(s.planted_by), plantedAt: s.planted_at, milestones: s.milestones || {},
    waters: d.prayers.filter((p) => p.seed_id === s.id).length,

  events = d.events.map((e) => ({
    id: e.id, type: e.type, title: e.title, date: e.date, time: e.time, place: e.place, by: String(e.created_by),
    invited: (e.invited || []).map(String), inviteOnly: !!e.invite_only,

    going: d.rsvps.filter((r) => r.event_id === e.id).map((r) => String(r.member_id))
  }));
  allPrayers = d.prayers.map((p) => ({ seed: p.seed_id, by: String(p.by_member), at: p.created_at }));
  allNotes = d.notes.map((n) => ({ seed: n.seed_id, by: String(n.by_member), at: n.created_at }));
  rawEvents = d.events;
  allEventPrayers = (d.eventPrayers || []).map((x) => ({ id: x.id, event: x.event_id, by: String(x.by_member), at: x.created_at }));
  photos = (d.photos || []).map((x) => ({ id: x.id, event: x.event_id, by: String(x.by_member), caption: x.caption, at: x.created_at, url: x.url }));

function me() { return meRow ? { id: String(meRow.telegram_id), name: meRow.name, avatar: meRow.avatar, color: meRow.color, role: meRow.role, leader: meRow.is_leader }
                             : { id: "", name: "You", avatar: "🌻", color: "#F2C76B", role: "" }; }
const person = (id) => members.find((m) => m.id === String(id)) || { name: "Someone", avatar: "🙂", color: "#E2E6DE" };

const eventById = (id) => events.find((e) => e.id === Number(id));
// Invite-only outings: everyone can see and pray for them; only invited people RSVP
const canRsvp = (e) => !e.inviteOnly || e.invited.includes(me().id);
const canBring = (e) => e.date >= todayKey() && (!e.inviteOnly || e.invited.includes(me().id) || me().leader);

// ================= SEED LOGIC =================
function kindOf(s) {
  const dates = Object.values(s.milestones);
  if (!dates.length) return null;
  const latest = dates.reduce((x, y) => (new Date(x) > new Date(y) ? x : y));
  return KINDS.find((k) => monthsBetween(s.plantedAt, latest) / dates.length <= k.pace);
}
function stage(s) {
  const rings = MILESTONES.filter((m) => s.milestones[m.key]).length, i = Math.min(rings, STAGES.length - 1), kind = kindOf(s);
  return { icon: kind ? kind.looks[i] : "🌱", rings: rings, kind: kind, size: Math.min(140, 64 + rings * 16),
           label: STAGES[i] + (kind ? " · becoming " + an(kind.name) : " · what will it become?") };
}
function fruitOf(s) {
  if (!s.milestones.saved) return null;
  const k = kindOf(s);
  return Object.assign({ months: Math.max(0, Math.round(monthsBetween(s.plantedAt, s.milestones.saved))), tree: k.looks[5] }, k);
}
function streak() {
  let n = 0, t = Date.now();
  if (!myPrayers.days.includes(localDay(t))) t -= DAY;
  while (myPrayers.days.includes(localDay(t))) { n++; t -= DAY; }
  return n;
}
const earned = () => BADGES.filter((b) => b.got(myPrayers)).map((b) => b.name);
function timeGrowing(s) {
  const d = Math.floor((Date.now() - new Date(s.plantedAt)) / DAY);
  if (d < 14) return plural(d, "day");
  if (d < 60) return plural(Math.floor(d / 7), "week");
  return plural(Math.round(d / 30.44), "month");
}

// ================= TOGETHER: week, feed, news =================
function weekStart() { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; }
function weekStats() {
  const start = weekStart(), days = [0, 0, 0, 0, 0, 0, 0];
  allPrayers.concat(allEventPrayers).forEach((p) => { const t = new Date(p.at); if (t >= start) days[Math.min(6, Math.floor((t - start) / DAY))]++; });
  const total = days.reduce((a, b) => a + b, 0), goal = Math.max(14, members.length * 7);   // a prayer a day each
  return { days: days, total: total, goal: goal, pct: Math.min(100, Math.round(total / goal * 100)) };
}
const ago = (iso) => { const m = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "just now"; if (m < 60) return m + "m"; const h = Math.floor(m / 60); if (h < 24) return h + "h"; return Math.floor(h / 24) + "d"; };
function feedItems() {
  const items = [], nick = (id) => (seedById(id) || { nick: "a friend" }).nick, groups = {};
  allPrayers.forEach((p) => { const k = p.by + "|" + p.seed + "|" + localDay(p.at);
    if (!groups[k]) groups[k] = { at: p.at, by: p.by, seed: p.seed, n: 0 }; groups[k].n++; if (p.at > groups[k].at) groups[k].at = p.at; });
  Object.values(groups).forEach((g) => items.push({ at: g.at, who: person(g.by), text: "<b>" + esc(person(g.by).name) + "</b> watered <b>" + esc(nick(g.seed)) + "</b>" + (g.n > 1 ? " " + g.n + "× 💧" : " 💧") }));
  allNotes.forEach((n) => items.push({ at: n.at, who: person(n.by), text: "<b>" + esc(person(n.by).name) + "</b> left a prayer for <b>" + esc(nick(n.seed)) + "</b> 💬" }));
  seeds.forEach((s) => {
    items.push({ at: s.plantedAt, who: person(s.by), text: "<b>" + esc(person(s.by).name) + "</b> planted a seed: <b>" + esc(s.nick) + "</b> 🌱" });
    MILESTONES.forEach((m) => { if (s.milestones[m.key]) items.push({ at: s.milestones[m.key], icon: m.icon, big: true, text: "<b>" + esc(s.nick) + "</b>: " + m.label + "! 🎉" }); });
  });
  const evTitle = (id) => (eventById(id) || { title: "an outing" }).title, eg = {}, pg = {};
  allEventPrayers.forEach((p) => { const k = p.by + "|" + p.event + "|" + localDay(p.at); if (!eg[k]) eg[k] = { at: p.at, by: p.by, ev: p.event, n: 0 }; eg[k].n++; if (p.at > eg[k].at) eg[k].at = p.at; });
  Object.values(eg).forEach((g) => items.push({ at: g.at, who: person(g.by), text: "<b>" + esc(person(g.by).name) + "</b> prayed for <b>" + esc(evTitle(g.ev)) + "</b> 🙏" + (g.n > 1 ? " " + g.n + "×" : "") }));
  photos.forEach((x) => { const k = x.by + "|" + x.event + "|" + localDay(x.at); if (!pg[k]) pg[k] = { at: x.at, by: x.by, ev: x.event, n: 0 }; pg[k].n++; });
  Object.values(pg).forEach((g) => items.push({ at: g.at, who: person(g.by), text: "<b>" + esc(person(g.by).name) + "</b> shared " + plural(g.n, "photo") + " from <b>" + esc(evTitle(g.ev)) + "</b> 📸" }));

// Big celebration pop-up with confetti
function confetti(bits) {
  bits = bits || ["🎉", "✨", "🌸", "💛", "🌿", "⭐"];
  for (let i = 0; i < 36; i++) {
    const c = document.createElement("span");
    c.className = "confetti"; c.textContent = pick(bits);
    c.style.left = Math.random() * 100 + "vw"; c.style.animationDuration = (1.6 + Math.random() * 1.6) + "s"; c.style.animationDelay = Math.random() * .4 + "s";
    c.style.fontSize = (16 + Math.random() * 18) + "px";
    document.body.appendChild(c); setTimeout(() => c.remove(), 3800);
  }
}
function splash(x, y, icon) {
  for (let i = 0; i < 8; i++) {
    const c = document.createElement("span"), a = (Math.PI * 2 * i) / 8;
    c.className = "splash"; c.textContent = icon || "💧"; c.style.left = (x - 11) + "px"; c.style.top = (y - 11) + "px";
    c.style.setProperty("--dx", Math.cos(a) * 70 + "px"); c.style.setProperty("--dy", Math.sin(a) * 70 + "px");
    document.body.appendChild(c); setTimeout(() => c.remove(), 900);
  }
}
let popup = null;
function celebrateBig(emoji, title, sub, bits, verse) {
  const v = verse || pick(VERSES);
  popup = { emoji: emoji, title: title, sub: sub || "", verse: v };
  confetti(bits); buzz(true); render();
}

const backTo = { event: "events", newevent: "events", seed: "seeds", plant: "seeds", profile: "world" };

function go(to, id) {
  bringOpen = false; picked = [];
  screen = to; currentId = id == null ? null : id; justWatered = false; celebrate = ""; undoStack = [];
  if (to === "profile") {
    const m = me();
    // First time? Start with a random character. Otherwise keep what they have.
    draft = { name: m.name, avatar: m.avatar === "🌻" ? randomAv() : m.avatar, color: m.color };
  }
  if (to === "event") draft = {};
  if (to === "newevent") draft = { inviteOnly: false, type: "outing", title: "", date: dayFromNow(7), time: "19:00", place: "", invited: [me().id], friends: [] };
  if (to === "seed" || to === "plant") draft = {};
  render(); window.scrollTo(0, 0);
}
function setDraft(k, v) { draft[k] = v; }
function pickDraft(k, v) { draft[k] = v; render(); }
function setAv(field, v) { const c = parseAv(draft.avatar) || parseAv(randomAv()); c[field] = v; draft.avatar = encAv(c); buzz(false); render(); }
function toggleFriendDraft(id) { draft.friends = draft.friends.includes(id) ? draft.friends.filter((x) => x !== id) : draft.friends.concat(id); render(); }
function togglePicked(id) { picked = picked.includes(id) ? picked.filter((x) => x !== id) : picked.concat(id); render(); }
function openBring() { bringOpen = !bringOpen; picked = []; render(); }
function toggleInvite(id) {
  const ed = draft.editId && eventById(draft.editId);
  if (ed && id === ed.by) return alert("The planner always stays invited."); draft.invited = draft.invited.includes(id) ? draft.invited.filter((x) => x !== id) : draft.invited.concat(id); render(); }

// Runs an action, reloads the shared data, and shows any error nicely
async function run(fn) {
  if (busy) return; busy = true; document.body.classList.add("busy");
  try { await fn(); await refresh(); }
  catch (e) { alert(e.message); try { await refresh(); } catch (_) {} }
  finally { busy = false; document.body.classList.remove("busy"); render(); }
}

      <p class="big">Hi ${esc(m.name)}! 👋</p>
      <p class="sub">You’re almost in. Your CG leader needs to approve you first. Let them know you’ve opened CG Hub.</p>
      <button class="btn outline" onclick="go('profile')">Set up my profile while I wait</button>
      <button class="btn" onclick="run(async () => {})">Check again</button></div>`;

  document.getElementById("title").textContent = screen === "newevent" && draft.editId ? "Edit outing" : titles[screen];

// ================= ACTIONS =================
function buzz(big) { if (tg && tg.HapticFeedback) big ? tg.HapticFeedback.notificationOccurred("success") : tg.HapticFeedback.impactOccurred("light"); }
function newBadgeText(before) {
  return BADGES.filter((b) => earned().includes(b.name) && !before.includes(b.name)).map((b) => "🏅 New badge: " + b.icon + " " + b.name + "!").join("<br>");
}
// Undo: each action remembers how to reverse itself
function undo() {
  const u = undoStack.pop(); if (!u) return;
  run(async () => { celebrate = ""; justWatered = false; await u.reverse(); buzz(false); });
}

// Praying feels instant: the plant grows right away and saves in the background
function prayNow(s, ev) {
  const before = earned(), wkBefore = weekStats();
  s.waters++; myPrayers.count++;
  if (!myPrayers.days.includes(todayKey())) myPrayers.days.push(todayKey());
  if (!myPrayers.seeds.includes(s.id)) myPrayers.seeds.push(s.id);
  const fake = { seed: s.id, by: me().id, at: new Date().toISOString() };
  allPrayers.push(fake);
  if (ev && ev.clientX) splash(ev.clientX, ev.clientY);
  buzz(false);
  const fresh = BADGES.filter((b) => earned().includes(b.name) && !before.includes(b.name));
  const wkNow = weekStats();
  api("water", { seed_id: s.id }).then((r) => {
    undoStack.push({ label: "Prayer logged for " + esc(s.nick), reverse: () => api("unwater", { id: r.prayer_id }) });
    if (!popup) render();
  }).catch((e) => { alert(e.message); refresh().then(render); });
  if (fresh.length) celebrateBig(fresh[0].icon, "New badge: " + fresh[0].name + "!", "Earned for: " + fresh[0].how.toLowerCase() + ". Keep going!", ["💧", "✨", fresh[0].icon]);
  else if (wkBefore.total < wkBefore.goal && wkNow.total >= wkNow.goal) celebrateBig("🌊", "Our CG hit this week’s prayer goal!", "A prayer a day each. Your prayer made it happen.", ["💧", "🌊", "🙏"]);
  return fresh.length > 0;
}
function water(ev) {
  const s = seedById(currentId);
  const big = prayNow(s, ev);
  justWatered = true; celebrate = big ? "" : pick(CHEERS);
  render();
}
function waterFromHome(id, ev) {
  go("seed", id);
  const big = prayNow(seedById(id), ev);
  justWatered = true; celebrate = big ? "" : pick(CHEERS);
  render();
}
function postNote() {
  const s = seedById(currentId), text = (draft.note || "").trim(), before = earned();
  if (!text) return alert("Write a short prayer first.");
  run(async () => {
    const r = await api("note", { seed_id: s.id, text: text });
    undoStack.push({ label: "Prayer posted for " + esc(s.nick), reverse: () => api("deleteNote", { id: r.note_id, prayer_id: r.prayer_id }) });
    draft.note = ""; justWatered = true;
  }).then(() => {
    const fresh = BADGES.filter((b) => earned().includes(b.name) && !before.includes(b.name));
    if (fresh.length) celebrateBig(fresh[0].icon, "New badge: " + fresh[0].name + "!", "Thank you for praying for " + esc(s.nick) + ".", ["💧", "💬", fresh[0].icon]);
    else { celebrate = "💬 Prayer posted. " + pick(CHEERS); buzz(true); render(); }
  });
}
function toggleMilestone(key) {
  const s = seedById(currentId), m = MILESTONES.find((x) => x.key === key), had = s.milestones[key] || null, kindBefore = kindOf(s);
  run(async () => {
    await api("setMilestone", { seed_id: s.id, key: key, date: had ? null : new Date().toISOString() });
    undoStack.push({ label: (had ? "Removed: " : "Logged: ") + m.label, reverse: () => api("setMilestone", { seed_id: s.id, key: key, date: had }) });
    justWatered = false;
  }).then(() => {
    const now = seedById(s.id); if (!now || had) { celebrate = ""; render(); return; }
    const kindNow = kindOf(now), fr = key === "saved" ? fruitOf(now) : null;
    celebrate = "";
    if (fr) celebrateBig(fr.fruit, "🎉 Party in heaven!", esc(now.nick) + " has borne fruit: " + an(fr.name) + " after " + monthText(fr.months) + " of watering.", [fr.fruit, "🎉", "🥳", "✝️", "✨", "👼"],
      VERSE.party);
    else celebrateBig(m.icon, esc(now.nick) + ": " + m.label + "!", "🟤 A new ring for the tree." + (kindNow && kindNow !== kindBefore ? " It’s growing into " + an(kindNow.name) + "! " + kindNow.fruit : ""), [m.icon, "🎉", "🌿", "✨"]);
  });
}
function plant() {
  const nick = document.getElementById("nick").value.trim(), outing = document.getElementById("outing").value.trim();
  if (!nick) return alert("Please enter a nickname first.");
  run(async () => {
    const r = await api("plant", { nick: nick, outing: outing });
    screen = "seeds";
    undoStack = [{ label: "Planted " + esc(nick), reverse: () => api("deleteSeed", { id: r.id }) }];
    setTimeout(() => celebrateBig("🌱", "Seed planted for " + esc(nick) + "!", "What will it grow into? Water it with prayer and see.", ["🌱", "💧", "✨"]), 50);
  });
}
function planWith(seedId) { go("newevent"); draft.friends = [seedId]; draft.title = "Outing with " + seedById(seedId).nick; render(); }
function bringFriends(eventId) {
  if (!picked.length) return alert("Tap a friend to add them first.");
  const names = picked.map((id) => seedById(id).nick), ids = picked.slice();
  run(async () => { await api("addFriends", { event_id: eventId, seed_ids: ids }); bringOpen = false; picked = []; })
    .then(() => { confetti(["🌱", "💛", "🎉"]); buzz(true);
      celebrate = "🌱 " + andList(names.map(esc)) + (names.length > 1 ? " are" : " is") + " on the list! Keep praying for them 🙏"; render(); });
}
function bringSeedTo(eventId, seedId) {
  const e = eventById(eventId), nick = seedById(seedId).nick;
  run(async () => { await api("addFriends", { event_id: eventId, seed_ids: [seedId] }); bringOpen = false; })
    .then(() => { confetti(["🌱", "💛", "🎉"]); buzz(true); celebrate = "🌱 " + esc(nick) + " is invited to " + esc(e.title) + "!"; render();
      if (confirm("Want to send " + nick + " an invite on Telegram?")) shareEvent(eventId); });
}
function removeFriend(eventId, seedId) {
  if (!confirm("Remove " + seedById(seedId).nick + " from this outing?")) return;
  run(async () => { await api("removeFriend", { event_id: eventId, seed_id: seedId }); });
}

const OUTING_CHEERS = ["🙏 Prayed! May it be a blessed time.", "🙏 Covering this outing in prayer!", "🙏 Amen! Praying for open hearts.", "🙏 Thank you for praying!"];
function prayForEvent(id, ev) {

    if (!popup) render();
  }).catch((err) => { alert(err.message); refresh().then(render); });
  const fresh = BADGES.filter((b) => earned().includes(b.name) && !before.includes(b.name)), wkNow = weekStats();
  celebrate = "";
  if (fresh.length) celebrateBig(fresh[0].icon, "New badge: " + fresh[0].name + "!", "Earned for: " + fresh[0].how.toLowerCase() + ". Keep going!", ["🙏", "✨", fresh[0].icon]);
  else if (wkBefore.total < wkBefore.goal && wkNow.total >= wkNow.goal) celebrateBig("🌊", "Our CG hit this week’s prayer goal!", "A prayer a day each. Your prayer made it happen.", ["💧", "🌊", "🙏"]);
  else celebrate = pick(OUTING_CHEERS);

}

// ----- outing photos -----
async function resizeImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Couldn’t read that photo. Try a different one.")); i.src = url; });
    const k = Math.min(1, 1280 / Math.max(img.width, img.height));   // shrink big photos so they upload fast
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.82);
  } finally { URL.revokeObjectURL(url); }
}
async function uploadPhotos(input) {
  const files = [...input.files].slice(0, 10), e = eventById(currentId), caption = (draft.caption || "").trim();
  input.value = "";
  if (!files.length || !e) return;
  uploading = { done: 0, total: files.length }; render();
  let ok = 0;
  for (const f of files) {
    try { const dataUrl = await resizeImage(f); await api("uploadPhoto", { event_id: e.id, data: dataUrl.split(",")[1], caption: caption }); ok++; }
    catch (err) { alert(err.message); }
    uploading.done++; render();
  }
  uploading = null; draft.caption = "";
  try { await refresh(); } catch (_) {}
  render();
  if (ok) celebrateBig("📸", plural(ok, "photo") + " shared!", "Thanks for capturing the memories from " + esc(e.title) + ".", ["📸", "✨", "💛"]);
}
function viewPhoto(id) { viewer = id; render(); }
function closeViewer() { viewer = null; render(); }
function deletePhoto(id) {
  if (!confirm("Remove this photo for everyone?")) return;
  viewer = null;
  run(async () => { await api("deletePhoto", { id: id }); });
}

function rsvp(yes) { const e = eventById(currentId); run(async () => { await api("rsvp", { event_id: e.id, going: yes }); buzz(yes); }); }
function rsvpHome(id) { run(async () => { await api("rsvp", { event_id: id, going: true }); }).then(() => { confetti(["🙋", "🎉", "💛", "📅"]); buzz(true); }); }
function editEvent(id) {
  const e = eventById(id); if (!e) return;
  go("newevent");
  draft = { editId: e.id, inviteOnly: e.inviteOnly, type: e.type, title: e.title, date: e.date, time: e.time, place: e.place,
            invited: e.invited.slice() };
  render();
}
function saveEvent() {
  if (!draft.title.trim()) return alert("Give your outing a name first.");
  if (!draft.date) return alert("Pick a date.");
  if (draft.editId) {
    const id = draft.editId, before = eventById(id), when = before.date + before.time + before.place;
    const changed = when !== draft.date + draft.time + draft.place.trim();
    run(async () => {
      await api("updateEvent", { id: id, type: draft.type, title: draft.title, date: draft.date, time: draft.time, place: draft.place,
                                 invited: draft.invited.map(Number), invite_only: !!draft.inviteOnly });
      screen = "event"; currentId = id; draft = {}; buzz(true);
    }).then(() => {
      const e = eventById(id);
      if (e && changed && e.date >= todayKey() && confirm("Saved! The date, time or place changed. Let everyone know on Telegram?"))
        shareLink("📢 Update: " + e.title + "\n📅 " + fmtDate(e.date) + ", " + fmtTime(e.time) + (e.place ? "\n📍 " + e.place : "") + "\nDetails in CG Hub 👇");
    });
    return;
  }
  run(async () => {
    const r = await api("createEvent", { type: draft.type, title: draft.title, date: draft.date, time: draft.time, place: draft.place,
                                         invited: draft.invited.map(Number), friend_seeds: draft.friends || [], invite_only: !!draft.inviteOnly });
    screen = "event"; currentId = r.id; buzz(true);
  }).then(() => { if (screen === "event" && confirm("Outing created! Send the invite on Telegram now?")) shareEvent(currentId); });
}
function cancelEvent(id) {
  if (!confirm("Cancel this event for everyone?")) return;
  run(async () => { await api("deleteEvent", { id: id }); screen = "events"; currentId = null; });
}
function shareLink(text) {
  const link = "https://t.me/share/url?url=" + encodeURIComponent(BOT_LINK) + "&text=" + encodeURIComponent(text);
  if (tg && tg.openTelegramLink) tg.openTelegramLink(link); else window.open(link, "_blank");
}
function shareEvent(id) {
  const e = eventById(id); if (!e) return;
  shareLink((e.type === "cg" ? "🙏 " : "🎉 ") + "You’re invited: " + e.title + "\n📅 " + fmtDate(e.date) + ", " + fmtTime(e.time) +
            (e.place ? "\n📍 " + e.place : "") + "\nRSVP in CG Hub 👇");
}
function inviteMembers() { shareLink("🌱 Join our CG on CG Hub! Open the link, tap the button at the bottom, and I’ll approve you."); }
function decide(id, yes) {
  const p = pending.find((x) => x.id === id);
  if (!yes && !confirm("Decline " + p.name + "?")) return;
  run(async () => { await api(yes ? "approve" : "decline", { telegram_id: Number(id) }); buzz(yes); });
}
function saveProfile() {
  if (!(draft.name || "").trim()) return alert("Please enter your name.");
  run(async () => { await api("saveProfile", { name: draft.name, avatar: draft.avatar, color: draft.color }); screen = status === "pending" ? "home" : "world"; })
    .then(() => { if (status === "approved") celebrateBig(avatar(me(), 110), "Looking good, " + esc(me().name) + "!", "Your new look is in the garden world. 🌍", ["✨", "💛", "⭐"]); });
}

// ================= START =================
let loadError = "";
async function start() {
  if (!tg || !tg.initData) { status = "outside"; render(); return; }
  try { await refresh(); } catch (e) { status = "error"; loadError = e.message; }
  // Opened from a notification button? Go straight to that seed or outing.
  const open = new URLSearchParams(location.search).get("open") || "";
  const [kind, oid] = open.split("-");
  if (status === "approved") {
    if (kind === "seed" && seedById(oid)) { screen = "seed"; currentId = Number(oid); }
    else if (kind === "event" && eventById(oid)) { screen = "event"; currentId = Number(oid); }
    else if (kind === "cg") screen = "cg";
  }
  render();
}
// Quietly pick up other members' changes when you come back to the app, and every minute
function quietRefresh() {
  const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (busy || typing || uploading || viewer || status !== "approved" || ["newevent", "profile", "plant"].includes(screen)) return;
  refresh().then(render).catch(() => {});
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) quietRefresh(); });
setInterval(quietRefresh, 60000);

document.getElementById("back").onclick = () => (screen === "newevent" && draft.editId ? go("event", draft.editId) : go(backTo[screen]));
document.getElementById("me-btn").onclick = () => { if (meRow) go("profile"); };
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => go(b.dataset.tab));
if (tg) { tg.ready(); tg.expand(); }
start();
</script>
