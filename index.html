<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CG Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --green: #2E7D4F; --green-dark: #1F5C39; --green-soft: #EEF5EF;
    --blue: #2563A8; --blue-soft: #EAF1F9;
    --ink: #1E2A22; --muted: #56635A; --line: #E2E6DE;
    --bg: #F6F7F2; --card: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--line);
           height: 60px; display: flex; align-items: center; gap: 8px; padding: 0 12px; }
  header h1 { margin: 0; font-size: 20px; }
  .back { width: 44px; height: 44px; border: none; background: none; font-size: 26px; cursor: pointer; }
  main { padding: 16px 16px 100px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px;
          display: flex; flex-direction: column; gap: 8px; }
  .label { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0; }
  .big { font-size: 18px; font-weight: 800; margin: 0; }
  .sub { font-size: 15px; color: var(--muted); margin: 0; }
  .btn { height: 50px; border-radius: 12px; border: none; background: var(--green); color: #fff;
         font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; }
  .btn.outline { background: #fff; color: var(--green); border: 2px solid var(--green); }
  .btn.blue { background: var(--blue); }
  .btn.dashed { background: none; color: var(--muted); border: 2px dashed #B9C3B6; }
  .row { display: flex; gap: 12px; }
  .stat { flex: 1; border-radius: 12px; padding: 12px; }
  .stat b { display: block; font-size: 26px; }
  .item { text-align: left; width: 100%; font: inherit; color: inherit; cursor: pointer;
          display: flex; gap: 14px; align-items: center; }
  .badge { width: 52px; height: 52px; flex-shrink: 0; border-radius: 12px; background: var(--green-soft);
           display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--green-dark); font-weight: 800; }
  .verse { background: #E9EFE6; border-radius: 16px; padding: 16px; font-style: italic; line-height: 1.45; }
  .bar { height: 12px; border-radius: 6px; background: var(--line); overflow: hidden; }
  .bar div { height: 100%; background: var(--blue); }
  .pot { position: relative; height: 170px; width: 100%; display: flex; align-items: flex-end; justify-content: center;
         background: linear-gradient(to top, #C9A882 0 22px, transparent 22px); border-radius: 12px; overflow: hidden; }
  .plant { display: inline-block; line-height: 1; margin-bottom: 14px; transform-origin: bottom center; transition: font-size .5s ease; }
  .grow { animation: grow .7s ease; }
  @keyframes grow { 0% { transform: scale(1); } 40% { transform: scale(1.3) rotate(-6deg); } 70% { transform: scale(.95) rotate(3deg); } 100% { transform: scale(1); } }
  .drop { position: absolute; left: 50%; top: 0; font-size: 34px; animation: drop .6s ease-in forwards; }
  @keyframes drop { from { transform: translate(-50%, -30px); opacity: 1; } to { transform: translate(-50%, 90px); opacity: 0; } }
  .levelup { background: #FFF4D6; color: #7A4B00; border-radius: 14px; padding: 12px; text-align: center; font-weight: 800; font-size: 17px; animation: pop .6s ease; }
  @keyframes pop { 0% { transform: scale(.5); opacity: 0; } 60% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
  .fruit { position: absolute; font-size: 30px; animation: pop .6s ease; }
  .milestone { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 8px 12px;
               border: 1px solid var(--line); border-radius: 12px; background: #fff; font: inherit; font-size: 15px;
               font-weight: 700; color: var(--ink); text-align: left; cursor: pointer; }
  .milestone.on { background: #FFF4D6; border-color: #F2C76B; }
  .badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .bdg { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: 8px 4px;
         border-radius: 12px; background: #F1F2EE; opacity: .45; }
  .bdg span { font-size: 26px; } .bdg b { font-size: 11px; } .bdg small { font-size: 10px; color: var(--muted); }
  .bdg.on { opacity: 1; background: #FFF4D6; }
  .toast { position: fixed; left: 12px; right: 12px; bottom: 84px; background: #1E2A22; color: #fff; border-radius: 14px;
           padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px; font-size: 15px; animation: pop .3s ease; }
  .toast span { flex: 1; }
  .toast button { min-height: 44px; padding: 0 16px; border: none; border-radius: 10px; background: #F2C76B; color: #1E2A22;
                  font-size: 15px; font-weight: 800; cursor: pointer; }
  .journey { display: flex; justify-content: space-between; width: 100%; font-size: 26px; }
  .journey span { opacity: .25; }
  .journey span.done { opacity: 1; }
  input { height: 48px; border-radius: 12px; border: 1px solid #B9C3B6; padding: 0 14px; font-size: 16px; width: 100%; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; height: 72px; background: var(--card);
        border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); }
  nav button { border: none; background: none; font-size: 12px; font-weight: 700; color: #5F6B63; cursor: pointer;
               display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  nav button span { font-size: 22px; }
  nav button.active { color: var(--green); }
</style>
</head>
<body>
<header><button class="back" id="back" aria-label="Back" hidden>‹</button><h1 id="title">CG Hub</h1></header>
<main id="app"></main>
<nav>
  <button data-tab="home"><span>🏠</span>Home</button>
  <button data-tab="events"><span>📅</span>Events</button>
  <button data-tab="cg"><span>👥</span>Our CG</button>
  <button data-tab="seeds"><span>🌱</span>Seeds</button>
</nav>

<script>
// ---- Sample data (fake names only — real data comes later from a database) ----
const events = [
  { id: 1, title: "CG Night: Worship & Word", date: "Fri 30 Oct", time: "8:00 PM", place: "[Venue]", going: 6, mine: null },
  { id: 2, title: "Seeds Outing: Lunch", date: "Sun 1 Nov", time: "12:30 PM", place: "[Venue]", going: 4, mine: null },
  { id: 3, title: "Prayer Walk", date: "Wed 4 Nov", time: "7:30 PM", place: "[Venue]", going: 3, mine: null }
];
const members = [
  { name: "Member A", role: "CG Leader" }, { name: "Member B", role: "Asst. Leader" },
  { name: "Member C" }, { name: "Member D" }, { name: "Member E" }, { name: "Member F" }
];
const DAY = 86400000;
const daysAgo = (d) => new Date(Date.now() - d * DAY).toISOString();
let seeds = [
  { id: 1, nick: "Friend J", by: "Member B", outing: "Coffee catch-up", waters: 1,
    plantedAt: daysAgo(14), milestones: {} },
  { id: 2, nick: "Friend K", by: "Member A", outing: "Badminton", waters: 22,
    plantedAt: daysAgo(150), milestones: { metcg: daysAgo(100), church: daysAgo(40) } },
  { id: 3, nick: "Friend L", by: "Member D", outing: "Birthday dinner", waters: 41,
    plantedAt: daysAgo(430), milestones: { metcg: daysAgo(380), church: daysAgo(300), saved: daysAgo(30), fp: daysAgo(10) } }
];
// Remember seeds on this phone (until we add a shared database)
try { const saved = JSON.parse(localStorage.getItem("cg-seeds-v2")); if (saved) seeds = saved; } catch (e) {}
function save() { try { localStorage.setItem("cg-seeds-v2", JSON.stringify(seeds)); } catch (e) {} }

// Moments of impact: can be ticked in any order
const MILESTONES = [
  { key: "metcg",   icon: "🤝", label: "Met the CG" },
  { key: "church",  icon: "⛪", label: "Stepped into church" },
  { key: "saved",   icon: "✝️", label: "Salvation" },
  { key: "planted", icon: "🏡", label: "Planted in church" },
  { key: "fp",      icon: "📖", label: "Started FP" }
];

// What a seed grows into is NOT decided at planting.
// It's decided only as milestones happen, by the pace of the journey:
// average months per milestone (change "pace" to adjust).
// Each kind has its own look at every ring; fruit appears at Salvation.
const KINDS = [
  { pace: 1,        fruit: "🍓", name: "strawberry plant", looks: ["🌱", "🌿", "☘️", "🌼", "🌼", "🌼"] },
  { pace: 3,        fruit: "🍊", name: "orange tree",      looks: ["🌱", "🌿", "🪴", "🌳", "🌳", "🌳"] },
  { pace: Infinity, fruit: "🥥", name: "coconut palm",     looks: ["🌱", "🌿", "🪴", "🌴", "🌴", "🌴"] }
];
const an = (w) => (/^[aeiou]/i.test(w) ? "an " : "a ") + w;
const monthsBetween = (a, b) => (new Date(b) - new Date(a)) / (30.44 * DAY);
function kindOf(s) {
  const dates = Object.values(s.milestones);
  if (!dates.length) return null;                      // no milestones yet: still a mystery
  const latest = dates.reduce((x, y) => (new Date(x) > new Date(y) ? x : y));
  const pace = monthsBetween(s.plantedAt, latest) / dates.length;
  return KINDS.find((k) => pace <= k.pace);
}
function fruitOf(s) {
  if (!s.milestones.saved) return null;
  const m = monthsBetween(s.plantedAt, s.milestones.saved);
  return Object.assign({ months: Math.max(0, Math.round(m)), tree: kindOf(s).looks[5] }, kindOf(s));
}
function timeGrowing(s) {
  const d = Math.floor((Date.now() - new Date(s.plantedAt)) / DAY);
  if (d < 14) return d + (d === 1 ? " day" : " days");
  if (d < 60) return Math.floor(d / 7) + " weeks";
  return Math.round(d / 30.44) + " months";
}
const monthText = (n) => n < 1 ? "under a month" : n + " month" + (n === 1 ? "" : "s");
const shortDate = (iso) => new Date(iso).toLocaleDateString("en-SG", { day: "numeric", month: "short", year: "numeric" });

// ---- App state ----
let screen = "home", current = null, justWatered = false, celebrate = "", undoStack = [];
const tg = window.Telegram && Telegram.WebApp;
const me = (tg && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || "friend";

// Stops typed text from being treated as code
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

// Growth comes from milestones: each milestone you log adds a ring.
// Watering never counts down to anything; it earns prayer badges instead.
const STAGES = [
  { icon: "🌱", label: "Seedling" },
  { icon: "🌿", label: "Growing" },
  { icon: "🪴", label: "Taking root" },
  { icon: "🌳", label: "Strong tree" },
  { icon: "🌳", label: "Deeply rooted" }
];
function stage(s) {
  const rings = MILESTONES.filter((m) => s.milestones[m.key]).length;
  const i = Math.min(rings, STAGES.length - 1), kind = kindOf(s);
  return {
    icon: kind ? kind.looks[i] : "🌱", rings: rings, kind: kind, size: Math.min(140, 64 + rings * 16),
    label: STAGES[i].label + (kind ? " · becoming " + an(kind.name) : " · what will it become?")
  };
}
const ringText = (n) => n + " ring" + (n === 1 ? "" : "s");

// ---- Prayer badges (earned by watering; saved on this phone) ----
let myPrayers = { count: 0, days: [], seeds: [] };
try { const p = JSON.parse(localStorage.getItem("cg-my-prayers")); if (p) myPrayers = p; } catch (e) {}
const todayKey = (d) => (d || new Date()).toISOString().slice(0, 10);
function streak() {
  let n = 0, d = new Date();
  if (!myPrayers.days.includes(todayKey(d))) d = new Date(Date.now() - DAY);
  while (myPrayers.days.includes(todayKey(d))) { n++; d = new Date(d - DAY); }
  return n;
}
const BADGES = [
  { icon: "💧", name: "First Drop",      how: "Pray for a friend",          got: (p) => p.count >= 1 },
  { icon: "🌦️", name: "Spring Shower",   how: "Pray 10 times",              got: (p) => p.count >= 10 },
  { icon: "🌧️", name: "Rain of Prayer",  how: "Pray 25 times",              got: (p) => p.count >= 25 },
  { icon: "🌊", name: "River of Prayer", how: "Pray 50 times",              got: (p) => p.count >= 50 },
  { icon: "🏆", name: "Prayer Warrior",  how: "Pray 100 times",             got: (p) => p.count >= 100 },
  { icon: "🔥", name: "On Fire",         how: "Pray 3 days in a row",       got: () => streak() >= 3 },
  { icon: "⭐", name: "Faithful Week",   how: "Pray 7 days in a row",       got: () => streak() >= 7 },
  { icon: "🤲", name: "Big Heart",       how: "Pray for 3 different friends", got: (p) => p.seeds.length >= 3 }
];
const earned = () => BADGES.filter((b) => b.got(myPrayers)).map((b) => b.name);

function go(to, item) { screen = to; current = item || null; justWatered = false; celebrate = ""; undoStack = []; render(); window.scrollTo(0, 0); }

function render() {
  const app = document.getElementById("app");
  const titles = { home: "CG Hub", events: "Events", event: "Event", cg: "Our CG", seeds: "Seeds", seed: "Seed", plant: "Plant a seed" };
  document.getElementById("title").textContent = titles[screen];
  document.getElementById("back").hidden = !["event", "seed", "plant"].includes(screen);
  const tab = { event: "events", seed: "seeds", plant: "seeds" }[screen] || screen;
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));

  if (screen === "home") {
    const total = seeds.reduce((a, s) => a + s.waters, 0);
    const e = events[0];
    app.innerHTML = `
      <div><p class="big" style="font-size:26px">Hi, ${esc(me)}!</p><p class="sub">Here’s what’s happening in our CG.</p></div>
      <div class="card"><p class="label">Next up</p><p class="big">${e.title}</p><p class="sub">${e.date} · ${e.time}</p>
        <button class="btn" onclick="go('event', events[0])">View event</button></div>
      <div class="card"><p class="label">Our seeds</p>
        <div class="row">
          <div class="stat" style="background:var(--green-soft)"><b style="color:var(--green-dark)">${seeds.length}</b>friends planted</div>
          <div class="stat" style="background:var(--blue-soft)"><b style="color:var(--blue)">${total}</b>times watered</div>
        </div>
        <button class="btn outline" onclick="go('seeds')">Water a seed</button></div>
      <div class="card"><p class="label">My prayer badges</p>
        <p class="sub">You’ve prayed ${myPrayers.count} time${myPrayers.count === 1 ? "" : "s"}${streak() > 1 ? " · 🔥 " + streak() + "-day streak" : ""}</p>
        <div class="badges">${BADGES.map((b) => { const has = b.got(myPrayers); return `
          <div class="bdg ${has ? "on" : ""}"><span>${b.icon}</span><b>${b.name}</b><small>${has ? "Earned" : b.how}</small></div>`; }).join("")}</div></div>
      <div class="verse">“I have planted, Apollos watered; but God gave the increase.”<br><b style="font-style:normal">1 Corinthians 3:6</b></div>`;
  }

  if (screen === "events") {
    app.innerHTML = `<button class="btn dashed">+ New event (leaders only)</button>` +
      events.map((e, i) => `
        <button class="card item" onclick="go('event', events[${i}])">
          <div class="badge" style="font-size:14px">${e.date.split(" ")[1]}<br>${e.date.split(" ")[2]}</div>
          <div><p class="big" style="font-size:16px">${e.title}</p><p class="sub">${e.date} · ${e.time}</p><p class="sub">${e.going} going</p></div>
        </button>`).join("");
  }

  if (screen === "event") {
    const e = current;
    app.innerHTML = `
      <div class="card"><p class="big" style="font-size:22px">${e.title}</p>
        <p class="sub">📅 ${e.date} · ${e.time}</p><p class="sub">📍 ${e.place}</p><p class="sub">👥 ${e.going} going</p></div>
      <p class="big" style="font-size:16px">Are you coming?</p>
      <div class="row">
        <button class="btn ${e.mine === "yes" ? "" : "outline"}" onclick="rsvp('yes')">I’m coming</button>
        <button class="btn ${e.mine === "no" ? "" : "outline"}" style="${e.mine === "no" ? "background:var(--muted)" : "color:var(--muted);border-color:var(--muted)"}" onclick="rsvp('no')">Can’t make it</button>
      </div>`;
  }

  if (screen === "cg") {
    app.innerHTML = `<p class="sub">${members.length} members</p><div class="card">` +
      members.map((m) => `
        <div class="item"><div class="badge" style="width:44px;height:44px;border-radius:22px;font-size:18px">${m.name.slice(-1)}</div>
        <span style="flex:1;font-weight:700">${m.name}</span>${m.role ? `<span class="sub" style="font-size:13px">${m.role}</span>` : ""}</div>`).join("") +
      `</div><button class="btn dashed">+ Add member (leaders only)</button>`;
  }

  if (screen === "seeds") {
    app.innerHTML = `<button class="btn" onclick="go('plant')">+ Plant a seed</button>
      <p class="sub">Everyone in our CG can water these. Nicknames only.</p>` +
      seeds.map((s, i) => { const st = stage(s), fr = fruitOf(s);
        const done = MILESTONES.filter((m) => s.milestones[m.key]).map((m) => m.icon).join(" ");
        return `
        <button class="card item" onclick="go('seed', seeds[${i}])">
          <div class="badge">${fr ? fr.fruit : st.icon}</div>
          <div><p class="big" style="font-size:16px">${esc(s.nick)}</p>
          <p class="sub">${fr ? "Bore fruit · " + fr.name : st.label} · ${ringText(st.rings)} · ${s.waters} prayer${s.waters === 1 ? "" : "s"}</p>
          <p class="sub" style="font-size:13px">Growing ${timeGrowing(s)} · planted by ${esc(s.by)}${done ? " · " + done : ""}</p></div>
        </button>`; }).join("");
  }

  if (screen === "seed") {
    const s = current, st = stage(s), fr = fruitOf(s);
    const plantArt = fr
      ? `<span class="plant ${justWatered || celebrate ? "grow" : ""}" style="font-size:${Math.max(120, st.size)}px">${fr.tree}</span>
         <span class="fruit" style="left:38%;top:30px">${fr.fruit}</span>
         <span class="fruit" style="left:56%;top:52px">${fr.fruit}</span>
         <span class="fruit" style="left:44%;top:78px">${fr.fruit}</span>`
      : `<span class="plant ${justWatered || celebrate ? "grow" : ""}" style="font-size:${st.size}px">${st.icon}</span>`;
    app.innerHTML = `
      <div class="card" style="align-items:center;text-align:center">
        <div class="pot">
          ${justWatered ? `<span class="drop">💧</span>` : ""}
          ${plantArt}
        </div>
        <p class="big" style="font-size:24px">${esc(s.nick)}</p>
        <p class="sub">${fr ? "Bore fruit after " + monthText(fr.months) + " · " + an(fr.name) : st.label} · 🟤 ${ringText(st.rings)}</p>
        <p class="sub">Growing ${timeGrowing(s)} · ${s.waters} prayers · planted by ${esc(s.by)}</p>
        <div class="journey">${MILESTONES.map((m) => `<span class="${s.milestones[m.key] ? "done" : ""}">${m.icon}</span>`).join("")}</div></div>
      ${celebrate ? `<div class="levelup">${celebrate}</div>` : ""}
      <button class="btn blue" onclick="water()">💧 I prayed — water it</button>
      ${justWatered && !celebrate ? `<p class="sub" style="text-align:center;color:var(--blue);font-weight:700">Thank you for praying for ${esc(s.nick)}!</p>` : ""}
      <div class="card"><p class="label">Milestones</p>
        <p class="sub" style="font-size:14px">Log each milestone when it happens, in any order. Every milestone adds a ring 🟤 to the tree. It’s okay to stay a seedling. Every seed grows in God’s time.</p>
        ${MILESTONES.map((m) => { const d = s.milestones[m.key]; return `
          <button class="milestone ${d ? "on" : ""}" onclick="toggleMilestone('${m.key}')">
            <span style="font-size:22px">${m.icon}</span><span style="flex:1">${m.label}</span>
            <span class="sub" style="font-size:13px">${d ? "🟤 " + shortDate(d) : "Log it"}</span>
          </button>`; }).join("")}
      </div>
      <div class="card"><p class="label">Last outing</p><p class="big" style="font-size:16px">${esc(s.outing)}</p></div>`;
  }

  if (screen === "plant") {
    app.innerHTML = `
      <p class="sub">Plant a seed for a friend you’re reaching out to. Use a nickname or initials only, never their full name.</p>
      <label for="nick"><b>Friend’s nickname</b></label><input id="nick" placeholder="e.g. Friend M">
      <label for="outing"><b>Outing (optional)</b></label><input id="outing" placeholder="e.g. Lunch after service">
      <button class="btn" onclick="plant()">Plant seed</button>`;
  }

  // Undo bar: shows after any seed action until you undo or move to another screen
  if (undoStack.length) app.innerHTML += `<div class="toast"><span>${undoStack[undoStack.length - 1].label}</span><button onclick="undo()">Undo</button></div>`;
}

// ---- Undo: remember how things were just before an action ----
function snapshot(label) {
  return { label: label, seeds: JSON.stringify(seeds), prayers: JSON.stringify(myPrayers), id: current && current.id };
}
function undo() {
  const undoInfo = undoStack.pop();
  if (!undoInfo) return;
  seeds = JSON.parse(undoInfo.seeds);
  myPrayers = JSON.parse(undoInfo.prayers);
  save();
  try { localStorage.setItem("cg-my-prayers", JSON.stringify(myPrayers)); } catch (e) {}
  if (screen === "seed") current = seeds.find((x) => x.id === undoInfo.id);
  celebrate = ""; justWatered = false;
  buzz(false); render();
}

function rsvp(choice) {
  const e = current;
  if (e.mine === "yes") e.going--;
  e.mine = choice;
  if (choice === "yes") e.going++;
  render();
}
function buzz(big) {
  // A little buzz on the phone (works inside Telegram)
  if (tg && tg.HapticFeedback) big ? tg.HapticFeedback.notificationOccurred("success") : tg.HapticFeedback.impactOccurred("light");
}
function water() {
  const snap = snapshot("Prayer logged for " + esc(current.nick));
  const before = earned();
  current.waters++;
  myPrayers.count++;
  if (!myPrayers.days.includes(todayKey())) myPrayers.days.push(todayKey());
  if (!myPrayers.seeds.includes(current.id)) myPrayers.seeds.push(current.id);
  try { localStorage.setItem("cg-my-prayers", JSON.stringify(myPrayers)); } catch (e) {}
  const fresh = BADGES.filter((b) => earned().includes(b.name) && !before.includes(b.name));
  celebrate = fresh.map((b) => "🏅 New badge: " + b.icon + " " + b.name + "!").join("<br>");
  justWatered = true; undoStack.push(snap);
  save(); buzz(!!celebrate); render();
}
function toggleMilestone(key) {
  const s = current;
  const m0 = MILESTONES.find((x) => x.key === key);
  const snap = snapshot((s.milestones[key] ? "Removed: " : "Logged: ") + m0.label);
  if (s.milestones[key]) {
    delete s.milestones[key];
    celebrate = "";
  } else {
    const kindBefore = kindOf(s);
    s.milestones[key] = new Date().toISOString();
    const m = MILESTONES.find((x) => x.key === key), kindNow = kindOf(s);
    const fr = key === "saved" ? fruitOf(s) : null;
    celebrate = fr
      ? "🟤 New ring, and " + esc(s.nick) + " has borne fruit! " + fr.fruit + " " + an(fr.name).replace(/^a/, "A") + " after " + monthText(fr.months) + "."
      : "🟤 New ring! " + m.icon + " " + esc(s.nick) + ": " + m.label + ". Praise God!" +
        (kindNow !== kindBefore ? "<br>It’s growing into " + an(kindNow.name) + "!" : "");
  }
  justWatered = false; undoStack.push(snap);
  save(); buzz(!!celebrate); render();
}
function plant() {
  const nick = document.getElementById("nick").value.trim();
  if (!nick) return alert("Please enter a nickname first.");
  const outing = document.getElementById("outing").value.trim() || "No outing logged yet";
  const snap = snapshot("Planted " + esc(nick));
  seeds.unshift({ id: Date.now(), nick, by: me, outing, waters: 0, plantedAt: new Date().toISOString(), milestones: {} });
  save();
  go("seeds");
  undoStack.push(snap); render();
}

document.getElementById("back").onclick = () => go({ event: "events", seed: "seeds", plant: "seeds" }[screen]);
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => go(b.dataset.tab));
if (tg) tg.ready();
render();
</script>
